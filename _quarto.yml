project:
  type: book
  output-dir: _site
  resources:
    - assets/
  pre-render:
    - python3 scripts/build_graph.py

book:
  title: "Mathematics for Data Science and AI"
  subtitle: "The mathematical spine of machine learning — objectives, representations, uncertainty, and learned systems"
  date: last-modified
  sidebar:
    tools:
      - icon: house
        href: /
        aria-label: Wayward House home
      - icon: grid
        href: /learn/
        aria-label: Library
      - icon: github
        href: https://github.com/WaywardHouse/waywardhouse-data-ai
        aria-label: Source on GitHub
  chapters:
    - index.qmd
    - part: "Orientation"
      chapters:
        - 00-orientation.qmd
        - prerequisites.qmd
    - part: "Modelling → Learning"
      chapters:
        - 01-mathematical-modelling.qmd
        - 02-statistical-learning.qmd
        - 03-optimisation-for-ml.qmd
    - part: "Representations"
      chapters:
        - 04-linear-algebra-representations.qmd
        - 07-information-theory-objectives.qmd
        - 08-neural-networks-deep-learning.qmd
    - part: "Uncertainty and Dynamics"
      chapters:
        - 05-probability-bayesian-uncertainty.qmd
        - 06-signals-sequences-state-estimation.qmd
    - part: "Synthesis"
      chapters:
        - 10-mini-projects-and-pathways.qmd
        - 11-further-enquiry-playbook.qmd
        - 12-fire-and-smoke-lab.qmd
        - 09-exercise-answers.qmd

bibliography: references.bib

format:
  html:
    css:
      - _extensions/wayward-book/wayward-book.css
      - lightbox.css
    include-in-header: _extensions/wayward-book/head.html
    include-after-body: _include/after-body.html
    smooth-scroll: true
    toc: true
    toc-depth: 3
    number-sections: true
    fig-align: center
    fig-width: 8
    fig-height: 4
    callout-appearance: simple
    code-fold: true
    html-math-method: katex

execute:
  freeze: auto
